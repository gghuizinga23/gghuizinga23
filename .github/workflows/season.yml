name: Draw the season grid

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Draw the grid
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/season.svg?color_snake=%23f4b52e&color_dots=%23ebedf0,%23b7e2c4,%236cc48a,%232e9e5b,%231a7a43
            dist/season-dark.svg?color_snake=%23f4b52e&color_dots=%23161b22,%230f3d24,%2317663a,%231f8a4c,%234ed486

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
