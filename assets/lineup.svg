et 12s ease-out 2.8s infinite}@keyframes net{0%,75%,87%,100%{transform:none}77%{transform:scaleY(1.45)}80%{transform:scaleY(.9)}83%{transform:scaleY(1.2)}}.goal{opacity:0;animation:goal 12s ease-out 2.8s infinite}@keyframes goal{0%,75.5%{opacity:0;transform:scale(.4)}78%{opacity:1;transform:scale(1.18)}80%,88%{opacity:1;transform:scale(1)}92%,100%{opacity:0;transform:scale(1)}}.ants{animation:ants 1.2s linear infinite}@keyframes ants{to{stroke-dashoffset:-28}}.ref{animation:ref 9s ease-in-out infinite alternate}@keyframes ref{from{transform:translate(-120px,10px)}to{transform:translate(110px,-24px)}}.var{animation:blink 1.2s steps(2,start) infinite}@keyframes blink{to{opacity:.25}}.sub{animation:shuf 1.6s ease-in-out infinite alternate}@keyframes shuf{to{transform:translateX(5px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="840" height="1130" rx="18" style="fill:var(--bg)"/><text class="d" x="40" y="50" font-size="44" letter-spacing="1.5" style="fill:var(--ink)">STARTING XI</text><text class="b" x="800" y="46" font-size="18" font-weight="700" text-anchor="end" letter-spacing="1.5" style="fill:var(--muted)">4-3-3 · MANAGER: G. HUIZINGA</text><text class="b" x="40" y="80" font-size="18" style="fill:var(--muted)">Build from the back: nothing leaves without the keeper's say-so.</text><clipPath id="p"><rect x="40" y="120" width="760" height="820" rx="6"/></clipPath><g clip-path="url(#p)"><rect x="40" y="120" width="760" height="82" fill="#1a7a43"/><rect x="40" y="202" width="760" height="82" fill="#1f8a4c"/><rect x="40" y="284" width="760" height="82" fill="#1a7a43"/><rect x="40" y="366" width="760" height="82" fill="#1f8a4c"/><rect x="40" y="448" width="760" height="82" fill="#1a7a43"/><rect x="40" y="530" width="760" height="82" fill="#1f8a4c"/><rect x="40" y="612" width="760" height="82" fill="#1a7a43"/><rect x="40" y="694" width="760" height="82" fill="#1f8a4c"/><rect x="40" y="776" width="760" height="82" fill="#1a7a43"/><