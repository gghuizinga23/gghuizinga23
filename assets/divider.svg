<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 44" width="840" height="44" role="img" aria-label="A player dribbling a ball along the touchline"><title>A player dribbling a ball along the touchline</title><style>:root{--bg:#f7f0dd;--bg2:#e6dab6;--ink:#14213d;--muted:#55657d;--sky1:#7cc4ee;--sky2:#e6f4fd;--stars:0;--beam:.10}@media (prefers-color-scheme:dark){:root{--bg:#0c1a2e;--bg2:#1b3050;--ink:#f6eed9;--muted:#a6b7cb;--sky1:#040914;--sky2:#17305a;--stars:1;--beam:.17}}.d{font-family:Impact, Haettenschweiler, 'Arial Narrow Bold', 'Franklin Gothic Bold', sans-serif}.b{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}.fb{transform-box:fill-box;transform-origin:center}.go{animation:go 8s linear infinite}@keyframes go{from{transform:translateX(-460px)}to{transform:translateX(460px)}}.hop{animation:hop .45s ease-out infinite alternate}@keyframes hop{to{transform:translateY(-9px)}}.rot{animation:rot 1s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}.step{animation:hop .3s ease-out infinite alternate}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><line x1="0" y1="36" x2="840" y2="36" stroke-width="3" stroke-dasharray="14 8" style="stroke:var(--muted)" opacity=".6"/><g transform="translate(420,26)"><g class="go"><g class="step"><circle cx="-30" cy="-2" r="9" fill="#f4b52e" stroke="#14213d" stroke-width="2.5"/></g><g class="hop"><g class="rot fb"><circle r="8" fill="#fff" stroke="#111" stroke-width="1.0"/><polygon points="0.0,-3.4 3.2,-1.0 2.0,2.7 -2.0,2.7 -3.2,-1.0" fill="#111"/><line x1="0.0" y1="-3.4" x2="0.0" y2="-7.6" stroke="#111" stroke-width="1.0"/><line x1="3.2" y1="-1.0" x2="7.2" y2="-2.3" stroke="#111" stroke-width="1.0"/><line x1="2.0" y1="2.7" x2="4.5" y2="6.1" stroke="#111" stroke-width="1.0"/><line x1="-2.0" y1="2.7" x2="-4.5" y2="6.1" stroke="#111" stroke-width="1.0"/><line x1="-3.2" y1="-1.0" x2="-7.2" y2="-2.3" stroke="#111" stroke-width="1.0"/></g></g></g></g></svg>
